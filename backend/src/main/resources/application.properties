# ===================================================================
# CookCircle Spring Boot Backend Configuration
# ===================================================================
spring.application.name=cookcircle-backend
server.port=8080
server.servlet.context-path=/

# ===================================================================
# MySQL 8 Database Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cookcircle_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:cookcircle_user}
spring.datasource.password=${DB_PASS:cookcircle_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# Security & JWT Configuration
# ===================================================================
cookcircle.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
cookcircle.jwt.expiration-ms=86400000

# ===================================================================
# Razorpay Test Gateway Configuration
# ===================================================================
cookcircle.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_CookCircle2026}
cookcircle.razorpay.key-secret=${RAZORPAY_KEY_SECRET:test_secret_cookcircle_xyz789}

# ===================================================================
# Swagger & OpenAPI Documentation
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.com.cookcircle=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
